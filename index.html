<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ecce Flyxion | Lissajous</title>
<style>
:root {
  color-scheme: dark;
  --green: #9fffd4;
  --dim: #568a78;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #020605;
  color: #a8cbbb;
  font-family: Consolas, 'Courier New', monospace;
  overflow: hidden;
}
main {
  height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
  padding: clamp(14px, 2.5vw, 32px);
}
canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}
main:after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 2;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0px,
    transparent 3px,
    #0005 4px
  );
  opacity: .3;
}
header, footer {
  position: relative;
  z-index: 4;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  font-size: 11px;
  letter-spacing: .16em;
}
a {
  color: var(--green);
  text-decoration: none;
}
a:hover { text-decoration: underline; }
.middle {
  position: relative;
  flex: 1;
  min-height: 0;
  display: grid;
  place-items: center;
  pointer-events: none;
}
.title {
  position: absolute;
  text-align: center;
  color: #c5ffe4;
  text-shadow: 0 0 12px #52ffb277;
  opacity: 1;
  transition: opacity 3.5s ease;
  letter-spacing: .17em;
  font-family: Consolas, 'Courier New', monospace;
  font-size: clamp(27px, 6.5vw, 92px);
  font-weight: 400;
  text-transform: uppercase;
  line-height: 1.15;
}
.title small {
  display: block;
  font-size: clamp(10px, 1.25vw, 16px);
  letter-spacing: .32em;
  color: #84bfa5;
  margin-top: 20px;
}
.title.hide { opacity: 0; }
.caption {
  position: absolute;
  bottom: clamp(10px, 5vh, 60px);
  width: min(850px, 94vw);
  text-align: center;
  font: clamp(15px, 1.8vw, 22px)/1.5
        Consolas, 'Courier New', monospace;
  color: #d7ffe8;
  text-shadow: 0 0 10px #000, 0 0 20px #000;
  min-height: 3em;
}
.panel {
  border-top: 1px solid #41695880;
  padding-top: 14px;
  background: linear-gradient(transparent, #020605dd);
  font-size: 11px;
}
.transport {
  display: flex;
  align-items: center;
  gap: 14px;
}
.transport button {
  width: 42px;
  height: 36px;
  border: 1px solid #6ca98c;
  background: #07120e;
  color: var(--green);
  cursor: pointer;
  font-size: 18px;
}
.time {
  white-space: nowrap;
  color: #9db8ab;
}
input[type=range] {
  accent-color: #8af0bb;
  cursor: pointer;
}
.seek {
  flex: 1;
  min-width: 30px;
}
.volume { width: 80px; }
.lower {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 12px;
  color: var(--dim);
  letter-spacing: .09em;
}
.lower button {
  background: none;
  border: 0;
  padding: 0;
  color: var(--green);
  font: inherit;
  cursor: pointer;
}
.lower select {
  background: #07120e;
  color: var(--green);
  border: 1px solid #416958;
  padding: 4px;
  font: inherit;
  max-width: 260px;
}
#status { color: #8dc6a8; }
@media(max-width:600px) {
  .volume { display: none; }
  .lower { font-size: 10px; }
  .title { font-size: clamp(27px, 8vw, 54px); }
  header { font-size: 9px; }
  .caption { bottom: 18px; }
}
@media(prefers-reduced-motion:reduce) {
  .title { transition: none; }
}
</style>
</head>
<body>
<main>
  <canvas id="scope"
    aria-label="Audio reactive Lissajous oscilloscope">
  </canvas>

  <header>
    <span>FLYXION / PHILOSOPHY</span>
    <a href="https://standardgalactic.github.io/philosophy/ecce-flyxion.pdf"
       target="_blank" rel="noopener">
      READ THE ESSAY PDF
    </a>
  </header>

  <section class="middle">
    <div class="title" id="title">
      ECCE FLYXION
      <small>A SELF-REFUTING PROPHECY</small>
    </div>
    <div class="caption" id="caption"></div>
  </section>

  <footer class="panel">
    <div class="transport">
      <button id="play" aria-label="Play">▶</button>
      <span class="time" id="time">00:00 / 00:00</span>
      <input class="seek" id="seek" type="range"
             min="0" max="1000" value="0" aria-label="Seek">
      <input class="volume" id="volume" type="range"
             min="0" max="1" step=".01" value=".85"
             aria-label="Volume">
    </div>
    <div class="lower">
      <span id="status">READY</span>
      <span>
        <button id="cc">CAPTIONS ON</button>
        &nbsp;·&nbsp;
        <button id="copy">COPY LINK</button>
      </span>
      <select id="tracks" aria-label="Audio track"></select>
    </div>
  </footer>

  <audio id="audio" preload="metadata"></audio>
</main>

<script>
'use strict';

const $ = s => document.querySelector(s);
const audio = $('#audio');
const canvas = $('#scope');
const ctx = canvas.getContext('2d');
const title = $('#title');
const caption = $('#caption');
const status = $('#status');
const play = $('#play');
const seek = $('#seek');
const time = $('#time');

const tracks = ['A_Self-Refuting_Prophecy.mp3'];
const params = new URLSearchParams(location.search);
const selected = tracks.includes(params.get('track'))
  ? params.get('track') : tracks[0];

let cues = [], captions = true, analyser = null;
let wave = null, ac = null, source = null;
let started = false, fadeTimer = null;

for (const name of tracks) {
  const o = document.createElement('option');
  o.value = name;
  o.textContent = name;
  $('#tracks').append(o);
}
$('#tracks').value = selected;

function load(name) {
  audio.pause();
  audio.src = name;
  audio.load();
  cues = [];
  caption.textContent = '';
  title.classList.remove('hide');
  started = false;
  triedBlob = false;
  clearTimeout(fadeTimer);
  status.textContent = 'READY';

  fetch(name.replace(/\.mp3$/i, '.vtt'))
    .then(r => {
      if (!r.ok) throw Error('Missing VTT');
      return r.text();
    })
    .then(t => {
      if ($('#tracks').value === name) {
        cues = parseVtt(t);
        status.textContent = 'CAPTIONS LOADED';
      }
    })
    .catch(() => {
      if ($('#tracks').value === name)
        status.textContent = 'VTT NOT FOUND';
    });
}

function seconds(s) {
  const a = s.replace(',', '.').split(':').map(Number);
  return a.length === 3
    ? a[0] * 3600 + a[1] * 60 + a[2]
    : a[0] * 60 + a[1];
}

function parseVtt(s) {
  return s.replace(/\r/g, '').split(/\n\s*\n/).flatMap(b => {
    const lines = b.trim().split('\n');
    const i = lines.findIndex(x => x.includes('-->'));
    if (i < 0) return [];

    const m = lines[i].match(
      /(\d{2}:)?\d{2}:\d{2}[.,]\d{3}\s+-->\s+(\d{2}:)?\d{2}:\d{2}[.,]\d{3}/
    );
    if (!m) return [];

    const [a, z] = m[0].split(/\s+-->\s+/);
    return [{
      start: seconds(a),
      end: seconds(z),
      text: lines.slice(i + 1).join(' ')
        .replace(/<[^>]*>/g, '').trim()
    }];
  });
}

function fmt(t) {
  if (!Number.isFinite(t)) return '00:00';
  const n = Math.floor(t);
  return String(Math.floor(n / 60)).padStart(2, '0')
    + ':' + String(n % 60).padStart(2, '0');
}

function ensureAudio() {
  try {
    if (!ac) {
      ac = new (window.AudioContext ||
                window.webkitAudioContext)();
      source = ac.createMediaElementSource(audio);
      analyser = ac.createAnalyser();
      analyser.fftSize = 2048;
      analyser.smoothingTimeConstant = .72;
      wave = new Uint8Array(analyser.fftSize);
      source.connect(analyser);
      analyser.connect(ac.destination);
    }
    ac.resume();
  } catch (e) {
    status.textContent = 'AUDIO VISUALIZATION UNAVAILABLE';
  }
}

$('#play').onclick = () => {
  if (audio.paused) {
    ensureAudio();
    audio.play().catch(() =>
      status.textContent = 'AUDIO FILE NOT FOUND'
    );
  } else audio.pause();
};

audio.addEventListener('play', () => {
  play.textContent = 'Ⅱ';
  play.setAttribute('aria-label', 'Pause');
  status.textContent = 'PLAYING';

  if (!started) {
    started = true;
    fadeTimer = setTimeout(
      () => title.classList.add('hide'), 150
    );
  }
});

audio.addEventListener('pause', () => {
  play.textContent = '▶';
  play.setAttribute('aria-label', 'Play');
  if (!audio.ended) status.textContent = 'PAUSED';
});

audio.addEventListener('ended', () => {
  status.textContent = 'FINISHED';
});

audio.addEventListener('error', () => {
  status.textContent = 'AUDIO FILE NOT FOUND';
});

let seeking = false, blobUrl = null, triedBlob = false;

function updateTime() {
  const duration = audio.duration;
  time.textContent = fmt(audio.currentTime) + " / " + fmt(duration);
  if (!seeking && Number.isFinite(duration) && duration > 0) {
    seek.value = Math.round(audio.currentTime / duration * 1000);
  }
  const c = cues.find(c =>
    c.start <= audio.currentTime && audio.currentTime < c.end
  );
  caption.textContent = captions ? (c?.text || "") : "";
}

audio.addEventListener("timeupdate", updateTime);
audio.addEventListener("seeked", updateTime);


function seekTarget() {
  const d = audio.duration;
  return Number.isFinite(d) && d > 0
    ? Number(seek.value) / 1000 * d : null;
}

// Some static servers ignore HTTP Range requests, which makes the
// browser treat the file as unseekable and jump back to 0:00.
// If a jump lands at the start, reload the track as a blob, which
// is always seekable, and resume at the requested time.
function loadAsBlob(t, resume) {
  triedBlob = true;
  status.textContent = 'BUFFERING FOR SEEK';
  fetch(audio.currentSrc || audio.src)
    .then(r => r.blob())
    .then(b => {
      if (blobUrl) URL.revokeObjectURL(blobUrl);
      blobUrl = URL.createObjectURL(b);
      audio.addEventListener('loadedmetadata', () => {
        audio.currentTime = t;
        if (resume) audio.play().catch(() => {});
        status.textContent = resume ? 'PLAYING' : 'PAUSED';
      }, { once: true });
      audio.src = blobUrl;
      audio.load();
    })
    .catch(() => status.textContent = 'SEEK UNAVAILABLE');
}

function jumpTo(t) {
  const resume = !audio.paused;
  audio.currentTime = t;
  audio.addEventListener('seeked', () => {
    if (!triedBlob && t > 2 && audio.currentTime < 1)
      loadAsBlob(t, resume);
  }, { once: true });
}

seek.addEventListener('input', () => {
  seeking = true;
  const t = seekTarget();
  if (t !== null)
    time.textContent = fmt(t) + " / " + fmt(audio.duration);
});

seek.addEventListener('change', () => {
  const t = seekTarget();
  if (t !== null) jumpTo(t);
  seeking = false;
});

$('#volume').oninput = e =>
  audio.volume = Number(e.target.value);

$('#cc').onclick = () => {
  captions = !captions;
  $('#cc').textContent =
    'CAPTIONS ' + (captions ? 'ON' : 'OFF');
  if (!captions) caption.textContent = '';
};

$('#copy').onclick = async () => {
  try {
    await navigator.clipboard.writeText(location.href);
    $('#copy').textContent = 'COPIED';
    setTimeout(() =>
      $('#copy').textContent = 'COPY LINK', 1500
    );
  } catch {
    $('#copy').textContent = 'COPY UNAVAILABLE';
  }
};

$('#tracks').onchange = e => {
  const u = new URL(location.href);
  u.searchParams.set('track', e.target.value);
  history.replaceState(null, '', u);
  load(e.target.value);
};

let W = 0, H = 0, dpr = 1;

function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth;
  H = innerHeight;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

let phase = 0;
let last = performance.now();
let energy = 0;

function frame(now) {
  const dt = Math.min((now - last) / 1000, .06);
  last = now;
  const active = !audio.paused && !audio.ended;
  let target = 0;

  if (analyser && active) {
    analyser.getByteTimeDomainData(wave);
    let sum = 0;
    for (let i = 0; i < wave.length; i += 4) {
      const x = (wave[i] - 128) / 128;
      sum += x * x;
    }
    target = Math.min(
      1, Math.sqrt(sum / (wave.length / 4)) * 3.8
    );
  }

  energy += (target - energy) * Math.min(1, dt * 5);
  phase += dt * (active ? .10 + energy * .08 : .018);

  ctx.fillStyle = '#020605';
  ctx.fillRect(0, 0, W, H);

  const cx = W / 2;
  const cy = H * .47;
  const R = Math.min(W * .39, H * .39, 430);
  ctx.save();
  ctx.translate(cx, cy);

  // Faint instrument reticle
  ctx.strokeStyle = 'rgba(95,185,137,.095)';
  ctx.lineWidth = .7;
  ctx.beginPath();
  ctx.moveTo(-R * 1.15, 0);
  ctx.lineTo(R * 1.15, 0);
  ctx.moveTo(0, -R * 1.15);
  ctx.lineTo(0, R * 1.15);
  ctx.stroke();

  for (let r = .25; r <= 1; r += .25) {
    ctx.beginPath();
    ctx.arc(0, 0, R * r, 0, Math.PI * 2);
    ctx.stroke();
  }

  // XY scope: phase-coupled oscillators
  // with live audio perturbations
  const n = 1100;
  const a = 3, b = 2;
  const shift = phase * .68;
  const drift = phase * .14;
  const amp = 1 + energy * .11;

  ctx.lineCap = 'round';

  for (let pass = 0; pass < 2; pass++) {
    ctx.beginPath();

    for (let i = 0; i <= n; i++) {
      const t = i / n * Math.PI * 2;
      const sample = wave && active
        ? (wave[Math.floor(i / n *
            (wave.length - 1))] - 128) / 128
        : 0;
      const perturb = sample * energy * .13;
      const x = Math.sin(a * t + shift + perturb)
        * R * .91 * amp;
      const y = Math.sin(
        b * t + drift + Math.PI / 2 + perturb * .7
      ) * R * .82 * amp;

      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }

    ctx.strokeStyle = pass === 0
      ? 'rgba(58,255,158,.12)'
      : `rgba(146,255,204,${.64 + energy * .3})`;
    ctx.lineWidth = pass === 0 ? 8 : 1.45;
    ctx.shadowBlur = pass === 0 ? 23 : 8;
    ctx.shadowColor = '#55ffad';
    ctx.stroke();
  }

  ctx.restore();
  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
load(selected);
</script>
</body>
</html>
